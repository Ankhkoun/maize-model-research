experiment: {id: E12-USA-FixedWindow-WPE, name: usa_tsvit_nodoy_fixed_window_wpe_seed42, seed: 42, status: authorized_train_validation}
model:
  image_size: 24
  patch_size: 2
  num_frames: 26
  num_channels: 10
  num_classes: 2
  dim: 128
  temporal_depth: 4
  spatial_depth: 4
  heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  emb_dropout: 0.0
  temporal_position_encoding: {kind: none}
  wavelet: {enabled: true, kind: fixed_window_mexican_hat, radii: [2, 6, 12], sigmas: [1.0, 3.0, 6.0], shifts: [0.0, 0.0, 0.0], gamma_init: 0.02, gamma_max: 0.20, eps: 1.0e-6, boundary_mode: masked_renormalized, force_fp32: true}
data: {window_size: 24, stride: 24, ignore_index: 255}
training:
  max_epochs: 100
  effective_batch_size: 32
  physical_batch_candidates: [32, 16, 8, 4, 2]
  optimizer: AdamW
  weight_decay: 0.0
  start_lr: 1.0e-8
  base_lr: 1.0e-3
  min_lr: 5.0e-6
  warmup_epochs: 10
  early_stopping_patience: 12
  amp: false
  amp_init_scale: 128.0
  amp_backoff_factor: 0.5
  amp_min_scale: 16.0
  amp_max_backoffs_per_batch: 6
  amp_growth_interval: 1000000
  wavelet_lr_scale: 0.25
evaluation: {selection_metric: maize_iou, validation_every_epochs: 1, test_during_training: false}
